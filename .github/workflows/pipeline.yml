name: Pipeline

on:
  schedule:
    # Os horários do HORAS_DO_CRON, no minuto 7 para fugir do pico de :00 do GitHub.
    - cron: "7 3,9,15,21 * * *"
  workflow_dispatch:
  # TEMPORÁRIO: só para a aceitação antes do merge; sai na Tarefa 12
  push:
    branches: [feat/bot-telegram-automatico]

# O estado (vigia.db e bot.json) é commitado na branch estado com o GITHUB_TOKEN.
# O indices.json vai para a main pelo próprio pipeline, com o TOKEN_DADOS.
permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar o backend
        working-directory: backend
        run: pip install -e .

      # Traz a branch estado para a pasta estado/; se ainda não existe, cria órfã.
      - name: Restaurar o estado
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin estado > /dev/null; then
            git fetch --depth=1 origin estado
            git worktree add estado FETCH_HEAD
          else
            git worktree add --orphan -b estado estado
          fi

      - name: Rodar o pipeline
        working-directory: backend
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN_DADOS: ${{ secrets.TOKEN_DADOS }}
          VIGIA_WORKER_SEGREDO: ${{ secrets.VIGIA_WORKER_SEGREDO }}
          INMET_TOKEN: ${{ secrets.INMET_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          VIGIA_WORKER_URL: ${{ vars.VIGIA_WORKER_URL }}
          VIGIA_SIMULACAO: ${{ vars.VIGIA_SIMULACAO }}
          GITHUB_REPO: ${{ github.repository }}
          DB_PATH: ../estado/vigia.db
          BOT_JSON_PATH: ../estado/bot.json
          # Fora da estado/ e sem upload como artefato.
          LOG_PATH: ${{ runner.temp }}/vigia.log
        run: python -m app.main --uma-vez

      - name: Preparar o estado
        working-directory: backend
        run: python -m scripts.preparar_estado ../estado/vigia.db

      - name: Gravar o estado na branch estado
        working-directory: estado
        run: |
          set -euo pipefail
          for arquivo in vigia.db bot.json; do
            if [ -e "$arquivo" ]; then
              git add "$arquivo"
            fi
          done
          if git diff --cached --quiet; then
            echo "Sem mudanças no estado."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "estado: execução de $(date -u +%Y-%m-%d)"
            git push origin HEAD:estado
          fi
